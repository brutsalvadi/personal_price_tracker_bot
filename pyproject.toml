[project]
name = "price-tracker"
version = "0.1.0"
description = "Price tracking daemon with Telegram alerts"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "playwright>=1.43",
    "apscheduler>=3.10",
    "tinydb>=4.8",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
]

[project.scripts]
price-tracker = "price_tracker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["price_tracker"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
